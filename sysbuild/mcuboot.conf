# The board's console is USB CDC ACM, which MCUboot does not bring up.
# Run the bootloader silent to keep it small.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

# MCUboot only has to check an image and swap two slots of the internal
# flash, so everything else the board's defaults bring in is left out. With
# this it is about 16.5 KB and fits the 20 KB it is given in
# dts/mcuboot_partitions.dtsi; the build fails if it outgrows that.

# No peripherals: pins, regulators, buses and the external flash.
CONFIG_GPIO=n
CONFIG_REGULATOR=n
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_MCUBOOT_INDICATION_LED=n

# No threads and no clock: it runs straight through, with nothing to wait for.
CONFIG_MULTITHREADING=n
CONFIG_SYS_CLOCK_EXISTS=n
CONFIG_NRF_RTC_TIMER=n
CONFIG_CLOCK_CONTROL=n
CONFIG_PM=n

# No diagnostics, which there is nowhere to print.
CONFIG_ASSERT=n
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_EXCEPTION_DEBUG=n
CONFIG_FAULT_DUMP=0

# Optimised as a whole, which takes out what is left unused.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
