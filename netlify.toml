# Netlify serves the web app (BLE console and OTA upgrade) straight from web/.
# There is no build step.

[build]
  publish = "web"

# The service worker and the page must always be revalidated, so a new deploy
# is picked up on the next load.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
