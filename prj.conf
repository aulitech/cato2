CONFIG_LOG=y

# Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO Sense Plus"
# "name" shell command. 26 characters is what fits in the advertising packet.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=26

# Console: Zephyr shell (and log output) over the Nordic UART Service and over
# the USB CDC ACM serial port
CONFIG_SHELL=y
CONFIG_SHELL_BT_NUS=y
CONFIG_SHELL_BT_NUS_INIT_LOG_LEVEL_INF=y
# The transport logs every send attempted before the client has subscribed, and
# those logs are themselves sent over the transport. Keep it quiet.
CONFIG_SHELL_BT_NUS_LOG_LEVEL_WRN=y
CONFIG_SHELL_BACKEND_SERIAL=y

# "bootloader" shell command
CONFIG_REBOOT=y

# OTA firmware upgrade: MCUmgr/SMP over Bluetooth into the MCUboot secondary slot
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# On-board LSM6DS3TR-C IMU, driven directly over I2C by src/imu.c rather than
# by the Zephyr sensor driver, so that every register can be configured
CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# "sleep" shell command (System OFF), and telling a motion wake-up from a reset
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# Persistent settings (name, blink, IMU configuration) in the storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
