CONFIG_LOG=y

# Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO Sense Plus"
# "name" shell command. 26 characters is what fits in the advertising packet.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=26

# Up to three devices at once, so that a computer using the board as a mouse
# or keyboard does not shut out the console and OTA from another device
CONFIG_BT_MAX_CONN=3

# HID over GATT: mouse, keyboard and sensor reports, in two HID services
# (src/hid.c)
CONFIG_BT_HIDS=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=3
CONFIG_BT_HIDS_ATTR_MAX=30
# Pools the service allocates its attributes from. Too small and the service
# is silently registered incomplete, and hosts then ignore it.
CONFIG_BT_GATT_UUID16_POOL_SIZE=80
CONFIG_BT_GATT_CHRC_POOL_SIZE=24
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
# Ask hosts for an 11.25 ms connection interval, the shortest that Apple hosts
# grant (and only to HID devices). Mouse movement and the sensor report rate
# depend on it. A host that refuses simply keeps its own interval.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# Several reports per connection event: pack the reports queued within a
# millisecond into one packet for hosts that support it, and ask for the 2 Mbit
# radio mode, which halves the time each packet takes
CONFIG_BT_GATT_NOTIFY_MULTIPLE=y
CONFIG_BT_USER_PHY_UPDATE=y
# Largest packets: ask each host for a 498-byte ATT MTU (the default is 23)
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# Room to queue a burst of reports between connection events
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=8
# Generic Human Interface Device
CONFIG_BT_DEVICE_APPEARANCE=960
# Hosts expect a Device Information Service with a PnP ID beside HID. The IDs
# are the pid.codes test pair: replace them with your own before shipping.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1209
CONFIG_BT_DIS_PNP_PID=0x0001
CONFIG_BT_DIS_PNP_VER=0x0001
# The serial number is the chip's unique ID, filled in at boot (src/main.c)
CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_SETTINGS=y
CONFIG_BT_DIS_STR_MAX=32
CONFIG_SETTINGS_RUNTIME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Auli.Tech"
CONFIG_BT_DIS_MODEL_NUMBER_STR="XIAO nRF52840 Sense Plus"

# Pairing: the console and OTA services need an encrypted link. Up to five
# bonded devices are remembered across resets (see src/bonds.c).
CONFIG_BT_SMP=y
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# Let a bonded device that has forgotten the board pair again.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y

# Console: Zephyr shell (and log output) over Bluetooth (src/ble_shell.c) and
# over the USB CDC ACM serial port
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_RING_BUFFER=y

# "bootloader" shell command
CONFIG_REBOOT=y

# OTA firmware upgrade: MCUmgr/SMP over Bluetooth into the MCUboot secondary slot
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# On-board LSM6DS3TR-C IMU, driven directly over I2C by src/imu.c rather than
# by the Zephyr sensor driver, so that every register can be configured
CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# "sleep" shell command (System OFF), and telling a motion wake-up from a reset
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# Persistent settings (name, bonds, blink, IMU configuration) in the storage
# partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# The Bluetooth transmit thread peaked at 676 of its default 768 bytes.
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024
